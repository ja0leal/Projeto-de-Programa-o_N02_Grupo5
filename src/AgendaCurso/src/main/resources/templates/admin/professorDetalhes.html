<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Meu App Spring</title>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>
<style th:replace="~{layout/layout.html :: styleGlass}"></style>
<body th:style="|background-image:url(@{/assets/background.svg});|"
      class="bg-cover bg-no-repeat bg-fixed min-h-screen flex flex-col">
<header th:replace="~{layout/layout.html :: header}"></header>

<main class="grid grid-cols-6 w-full gap-3 flex-1 px-10 py-10 my-5">

    <div class="h-full col-span-2 bg-gray-200 rounded-lg shadow-lg border border-gray-700 p-6">
        <div class="w-full bg-white rounded-lg shadow-md overflow-hidden">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-5 border-b border-gray-100">
                <div>
                    <h3 class="text-xl font-semibold text-gray-800">Detalhes: <span
                            th:text="${professor.getNome()}"></span></h3>
                    <p class="text-sm text-gray-500">Área de Administração — Informações</p>
                </div>
            </div>

            <div class="p-4">
                <dl class="mt-6 grid grid-cols-5 gap-y-6 gap-x-4">
                    <div class="col-span-1">
                        <dt class="text-sm font-medium text-gray-500">Id:</dt>
                        <dd class="mt-1 text-lg font-semibold text-gray-900"
                            th:text="${professor.getIdProfessor()}"></dd>
                    </div>
                    <div class="col-span-4">
                        <dt class="text-sm font-medium text-gray-500">Nome Completo:</dt>
                        <dd class="mt-1 text-lg font-semibold text-gray-900" th:text="${professor.getNome()}"></dd>
                    </div>

                </dl>
            </div>
        </div>
    </div>

    <div class="h-full col-span-4 bg-gray-100 rounded-lg shadow-lg border border-gray-200 p-6">
        <div class="w-full max-w-5xl bg-white rounded-lg shadow-md overflow-hidden">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-5 border-b border-gray-100">
                <div>
                    <h3 class="text-xl font-semibold text-gray-800">Turmas: <span
                            th:text="${professor.getNome()}"></span></h3>
                    <p class="text-sm text-gray-500">Área de Administração — Turmas do Professor</p>
                </div>
            </div>

            <div class="p-4">
                <div class="overflow-x-auto rounded-md border border-gray-100">
                    <table class="table-fixed w-full text-sm">
                        <thead class="bg-white">
                        <tr>
                            <th class="w-16 px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">#</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nome</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Diciplina</th>
                            <th class="w-36 px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">Ações</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="turma : ${turmas}" class="odd:bg-white even:bg-gray-50">
                            <td class="px-4 py-3 text-gray-700" th:text="${turma.getIdTurma()}">Id Professor
                            </td>
                            <td class="px-4 py-3 text-gray-900 font-medium" th:text="${turma.getNome()}">Nome
                                Turma
                            </td>
                            <td class="px-4 py-3 text-gray-900 font-medium" th:text="${turma.getDiciplina().getNome()}">
                                Nome
                                Diciplina
                            </td>
                            <td class="px-4 py-3 text-right">
                                <div class="inline-flex items-center gap-2">
                                    <a th:href="@{/Admim/TurmaDetalhes/{id}(id=${turma.getIdTurma()})}"
                                       class="view-btn inline-flex items-center justify-center w-8 h-8 rounded-md border border-gray-200 hover:bg-gray-50"
                                       title="Visualizar">

                                        <i class="fa-regular fa-eye"></i>
                                    </a>

                                    <button type="button"
                                            class="edit-btn inline-flex items-center justify-center w-8 h-8 rounded-md border border-gray-200 hover:bg-gray-50"
                                            th:attr="data-id=${turma.getIdTurma()}"
                                            title="Editar">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </button>

                                    <button type="button"
                                            class="btnDeletar inline-flex items-center justify-center w-8 h-8 rounded-md border border-red-200 text-red-600 hover:bg-red-50"
                                            th:attr="data-id=${turma.getIdTurma()}"
                                            title="Excluir">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(turmas)}">
                            <td colspan="3" class="px-4 py-8 text-center text-sm text-gray-500">
                                Nenhuma turma encontrada.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/layout.html :: footer}"></footer>
</body>
<script type="module" th:src="@{/js/professores.js}"></script>
</html>
