<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Meu App Spring</title>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>
<style th:replace="~{layout/layout.html :: styleGlass}"></style>
<body th:style="|background-image:url(@{/assets/background.svg});|"
      class="bg-cover bg-no-repeat bg-fixed min-h-screen flex flex-col">
<header th:replace="~{layout/layout.html :: header}"></header>

<main class="grid grid-cols-6 w-full gap-3 flex-1 px-10 py-10 my-5">

    <div class="h-full col-span-2 bg-gray-200 rounded-lg shadow-lg border border-gray-700 p-6">
        <div class="w-full bg-white rounded-lg shadow-md overflow-hidden">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-5 border-b border-gray-100">
                <div>
                    <h3 class="text-xl font-semibold text-gray-800">Turmas</h3>
                    <p class="text-sm text-gray-500">Área de Administração — Adicionar turma</p>
                </div>
            </div>
            <div class="rounded-md border border-gray-100 px-4 grid grid-cols-1 gap-4">
                <p class="text-xs text-red-600" id="erroInputNome">
                </p>
                <div>
                    <label for="inputNome" class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
                    <input
                            id="inputNome"
                            type="text"
                            name="q"
                            placeholder="Nome..."
                            class="w-full px-3 py-2 rounded-md border border-gray-200 bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
                            aria-label="Adicionar Professor"
                    />
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="inputIdDiciplina" class="block text-sm font-medium text-gray-700 mb-1">Diciplina</label>
                        <select id="inputIdDiciplina" name="diciplina"
                                class="w-full px-3 py-2 rounded-md border border-gray-200 bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
                            <option th:each="diciplina : ${diciplinas}"
                                    th:text="${diciplina.getNome()}"
                                    th:value="${diciplina.getIdDiciplina()}">
                            </option>
                        </select>
                    </div>

                    <div>
                        <label for="inputIdProfessor" class="block text-sm font-medium text-gray-700 mb-1">Professor</label>
                        <select id="inputIdProfessor" name="professor"
                                class="w-full px-3 py-2 rounded-md border border-gray-200 bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
                            <option th:each="professor : ${professores}"
                                    th:value="${professor.getIdProfessor()}"
                                    th:text="${professor.getNome()}">
                            </option>
                        </select>
                    </div>
                </div>
                <div>
                    <button type="button"
                            id="btnAdicionar"
                            class="w-full inline-flex items-center justify-center gap-2 px-3 py-2 rounded-md bg-indigo-600 text-white text-sm font-medium shadow-sm hover:bg-indigo-700 transition">
                        <i class="fa-solid fa-plus"></i>
                        <span>Adicionar</span>
                    </button>
                </div>
                <p class="text-xs mt-1 text-green-600" id="sucessInputNome">
                </p>
            </div>
        </div>
    </div>

    <div class="h-full col-span-4 bg-gray-100 rounded-lg shadow-lg border border-gray-200 p-6">
        <div class="w-full bg-white rounded-lg shadow-md overflow-hidden">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-5 border-b border-gray-100">
                <div>
                    <h3 class="text-xl font-semibold text-gray-800">Turmas</h3>
                    <p class="text-sm text-gray-500">Área de Administração — lista de turmas</p>
                </div>
            </div>

            <div class="p-4">
                <div class="overflow-x-auto rounded-md border border-gray-100">
                    <table class="table-fixed w-full text-sm">
                        <thead class="bg-white">
                        <tr>
                            <th class="w-16 px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">#</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nome</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Diciplina</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Professor</th>
                            <th class="w-36 px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">Ações</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="turma : ${turmas}" class="odd:bg-white even:bg-gray-50">
                            <td class="px-4 py-3 text-gray-700" th:text="${turma.getIdTurma()}">Id Professor
                            </td>
                            <td class="px-4 py-3 text-gray-900 font-medium" th:text="${turma.getNome()}">Nome
                                Turma
                            </td>
                            <td class="px-4 py-3 text-gray-900 font-medium" th:text="${turma.getDiciplina().getNome()}">
                                Nome
                                Diciplina
                            </td>
                            <td class="px-4 py-3 text-gray-900 font-medium" th:text="${turma.getProfessor().getNome()}">
                                Nome
                                Professor
                            </td>

                            <td class="px-4 py-3 text-right">
                                <div class="inline-flex items-center gap-2">
                                    <a th:href="@{/Admim/TurmaDetalhes/{id}(id=${turma.getIdTurma()})}"
                                       class="view-btn inline-flex items-center justify-center w-8 h-8 rounded-md border border-gray-200 hover:bg-gray-50"
                                       title="Visualizar">

                                        <i class="fa-regular fa-eye"></i>
                                    </a>

                                    <button type="button"
                                            class="btnDeletar inline-flex items-center justify-center w-8 h-8 rounded-md border border-red-200 text-red-600 hover:bg-red-50"
                                            th:attr="data-id=${turma.getIdTurma()}"
                                            title="Excluir">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(turmas)}">
                            <td colspan="3" class="px-4 py-8 text-center text-sm text-gray-500">
                                Nenhum professor encontrado.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{layout/layout.html :: footer}"></footer>
</body>
<script type="module" th:src="@{/js/turmas.js}"></script>
</html>
