<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
</head>
<body>

<div class="container">
    <form th:action="@{/login-process}" method="post">
        <h2>Login</h2>

        <div th:if="${param.success}">
            <div class="alert alert-success">
                Registro realizado com sucesso! Faça seu login.
            </div>
        </div>

        <div th:if="${param.error}">
            <div class="alert alert-danger">
                E-mail ou senha inválidos.
            </div>
        </div>

        <div th:if="${param.logout}">
            <div class="alert alert-info">
                Você foi desconectado.
            </div>
        </div>


        <div>
            <label for="email">E-mail (Username)</label>
            <input type="email" id="email" name="username" required autofocus>
        </div>

        <div>
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit">Entrar</button>
    </form>

    <p>Não tem uma conta? <a th:href="@{/register/student}">Registre-se aqui</a></p>
</div>

</body>
</html>
